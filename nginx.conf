server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/woff2;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NAS media downloads — proxy to the telegram-web-dl companion service.
    # Same-origin path, so the browser needs no CORS handling.
    location /dl/ {
        proxy_pass http://telegram-web-dl:9090/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }

    # hashed, immutable build assets
    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}