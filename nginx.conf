server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off; # hide the nginx version banner

    # security headers (self-hosted web client)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/woff2;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the version manifest for the hashed chunk URLs — a stale
    # cached copy references old chunks that 404 after an upgrade. Never cache it.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # NAS media downloads — proxy to the telegram-web-dl companion service.
    # The upstream is resolved per-request via a variable: if the dl service
    # is absent (e.g. a single-service compose), nginx still starts and the
    # web app works normally — only /dl/ requests return 502.
    # ^~ wins over the hashed-asset regex below, so any /dl/ URI (even one
    # ending in .js/.jpg/...) is always proxied, never served from disk.
    location ^~ /dl/ {
        # Variable proxy_pass requires an explicit resolver; Docker's
        # embedded DNS (127.0.0.11) resolves the companion service name.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $dl_upstream http://telegram-web-dl:9090;
        rewrite ^/dl/(.*)$ /$1 break;
        proxy_pass $dl_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }

    # hashed, immutable build assets
    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|wasm)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, immutable, max-age=2592000";
        try_files $uri =404;
    }
}
