server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/woff2;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed, immutable build assets
    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}